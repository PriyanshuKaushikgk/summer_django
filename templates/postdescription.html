{% extends "index.html" %}
{% block outlet %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Description Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 100%;
    padding:100%

}

.blog-container {
    width: 80%;
    max-width: 800px;
    margin: 20px;
    text-align: center;
}

.blog-card {
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    margin-bottom: 20px;
    text-align: center;

}

.blog-image {
    width: 100%;
    height: 300px;
    object-fit: cover;
}

.blog-content {
    padding: 20px;
}

.blog-title {
    font-size: 24px;
    margin-bottom: 10px;
    color: #333;
}

.blog-date {
    font-size: 14px;
    color: #999;
    margin-bottom: 15px;
    display: block;
}

.blog-description {
    font-size: 16px;
    line-height: 1.6;
    color: #555;
}

</style>
<body>

    <div class="blog-container">
        <div class="blog-card">
            <img src="/media/{{BLOG.image}}"  alt="Blog Image" class="blog-image">
            <div class="blog-content">
                <h2 class="blog-title">{{BLOG.title}}</h2>
                <span class="blog-date">{{BLOG.date}}</span>
                <p class="blog-description">
                    {{BLOG.description}}
                </p>
            </div>
        </div>
    </div>

</body>
</html>
{% endblock outlet %}
